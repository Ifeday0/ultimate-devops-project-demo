
# CI/CD pipeline for Product Catalog Service

name: product-catalog-ci

on:
  pull_request:
    branches:
      - main
#  push:
  #  branches:
     # - main

#permissions:
  #contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go 1.22
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: src/product-catalog/go.sum

      - name: Download dependencies
        working-directory: src/product-catalog
        run: go mod download

      - name: Build
        working-directory: src/product-catalog
        run: go build -o product-catalog-service main.go

      - name: Run unit tests
        working-directory: src/product-catalog
        run: go test ./...

  code-quality:
    name: Code Quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go 1.22
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: src/product-catalog/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: src/product-catalog
          args: --timeout=5m

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04

    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: src/product-catalog
          file: src/product-catalog/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}

  updatek8s:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-24.04

    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Update image tag in deployment manifest
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{ github.run_id }}|" kubernetes/productcatalog/deploy.yaml

      - name: Commit and push changes
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add kubernetes/productcatalog/deploy.yaml

          git diff --cached --quiet || git commit -m "[CI]: Update product catalog image tag"

          git push origin HEAD:main
